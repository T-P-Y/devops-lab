server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/mylab.crt;
    ssl_certificate_key /etc/nginx/ssl/mylab.key;

    root /var/www/html;
    index index.nginx-debian.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
